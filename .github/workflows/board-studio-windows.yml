name: Board Studio Windows

on:
  push:
    branches: [feat/board-studio]
  workflow_dispatch:
    inputs:
      release_installer:
        description: Only enable when explicitly releasing a Windows installer.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: board-studio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: board-studio-windows
          cache-on-failure: true
      - uses: ./.github/actions/setup/workspace
        with:
          cache-scope: board-studio
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about@0.9.3
      - name: Build workspace packages and the HTML engine
        run: bun run build:packages
      - name: Write third-party notices
        run: bun tools/release/release-packages/src/cli.ts notices
      - name: Generate desktop icons
        run: bun run generate:icons --target desktop
      - name: Generate desktop menus
        run: bun run generate:tauri-menu
      - name: Build the embedded editor
        run: bunx vite build
      - name: Build the Windows app without an installer
        working-directory: desktop
        run: node ../node_modules/@tauri-apps/cli/tauri.js build --config tauri.board-studio.conf.json --no-bundle
      - name: Assemble the portable folder
        run: bun tools/release/release-packages/src/board-studio/portable.ts
      - name: Upload the portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Board-Studio-Portable-Windows-x64
          path: target/release/Board-Studio-Portable/
          if-no-files-found: error
          retention-days: 30
      - name: Bundle an installer only for an explicit release
        if: github.event_name == 'workflow_dispatch' && inputs.release_installer
        working-directory: desktop
        run: node ../node_modules/@tauri-apps/cli/tauri.js bundle --config tauri.board-studio.conf.json --bundles nsis
      - name: Upload the requested installer
        if: github.event_name == 'workflow_dispatch' && inputs.release_installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Board-Studio-Installer-Windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
